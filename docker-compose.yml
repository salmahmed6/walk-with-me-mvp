version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: walkwithme-db
    environment:
      POSTGRES_DB: walkwithme_db
      POSTGRES_USER: walkwithme_user
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - walkwithme-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: walkwithme-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - walkwithme-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: walkwithme-backend
    environment:
      DATABASE_URL: "postgresql://walkwithme_user:secure_password_123@postgres:5432/walkwithme_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "your_super_secure_jwt_secret_key_here_change_this_in_production"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - walkwithme-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:


networks:
  walkwithme-network:
    driver: bridge
